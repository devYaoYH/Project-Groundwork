<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A2A Local Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    main { max-width: 960px; margin: 32px auto; padding: 0 24px; } table { width:100%; border-collapse:collapse; margin-top:20px } th,td { border-bottom:1px solid var(--border); padding:10px; text-align:left } #status { color:var(--muted) }
  </style>
</head>
<body>
<main>
  <p><a href="/">← All traces</a></p>
  <h1>Local leaderboard</h1>
  <p>Calendar OpenSkill ratings rebuilt from the traces in this SQLite database. Other games need to publish a rating-event adapter before they can join this board.</p>
  <p id="status">Loading…</p>
  <table><thead><tr><th>Rank</th><th>Player</th><th>Games</th><th>MMR</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
(async () => {
  const status = document.getElementById('status'); const rows = document.getElementById('rows');
  try {
    const data = await (await fetch('/api/leaderboards/calendar')).json();
    const board = data.leaderboard || [];
    status.textContent = `${data.metadata?.rating_event_count ?? 0} rated runs from ${data.metadata?.trace_count ?? 0} Calendar traces`;
    rows.innerHTML = board.map((row, i) => `<tr><td>${i + 1}</td><td>${esc(row.player_id)}</td><td>${row.games_played}</td><td>${Number(row.mmr).toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="4">No rateable Calendar traces yet.</td></tr>';
  } catch (error) { status.textContent = `Could not load leaderboard: ${error.message}`; }
})();
function esc(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
</script>
</body>
</html>
