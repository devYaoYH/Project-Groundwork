# Request 1: one shared builder, registry caches, candidate outputs only.
steps:
  - name: docker:27.5.1-cli
    id: docker-tools
    entrypoint: sh
    args:
      - -ec
      - |
        mkdir -p /builder/home/bin /builder/home/.docker/cli-plugins
        cp /usr/local/bin/docker /builder/home/bin/docker
        cp /usr/local/libexec/docker/cli-plugins/docker-buildx /builder/home/.docker/cli-plugins/docker-buildx
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: select-runtime
    entrypoint: bash
    args: ['deploy/run_python.sh', 'deploy/cloud_images.py', 'prepare']
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: build-candidates
    entrypoint: bash
    args:
      - -ec
      - |
        export PATH="/builder/home/bin:$$PATH"
        bash deploy/run_python.sh deploy/cloud_images.py build
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: record-candidates
    entrypoint: bash
    args:
      - -ec
      - |
        export PATH="/builder/home/bin:$$PATH"
        bash deploy/run_python.sh deploy/cloud_images.py candidates
        cp .platform-build/candidates.json candidates.json
        cp .platform-build/cloud-metadata.json cloud-metadata.json
artifacts:
  objects:
    location: gs://$PROJECT_ID-groundwork-build-source/ci-image-builds/$BUILD_ID/
    paths: ['candidates.json', 'cloud-metadata.json']
substitutions:
  _REGION: us-central1
  _SOURCE_SHA: ''
  _RUNTIME_SOURCE_SHA: ''
serviceAccount: projects/$PROJECT_ID/serviceAccounts/groundwork-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - PROJECT_ID=$PROJECT_ID
    - REGION=${_REGION}
    - SOURCE_SHA=${_SOURCE_SHA}
    - RUNTIME_SOURCE_SHA=${_RUNTIME_SOURCE_SHA}
    - BUILD_ID=$BUILD_ID
    - DOCKER_CONFIG=/builder/home/.docker
    - BUILDX_NO_DEFAULT_ATTESTATIONS=1
    - PYTHONDONTWRITEBYTECODE=1
timeout: 2400s
