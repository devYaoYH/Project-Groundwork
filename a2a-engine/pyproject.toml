[project]
name = "a2a-engine"
version = "0.1.0"
description = "Environment-agnostic framework for agent-to-agent coordination experiments."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "certifi>=2024.2.2",
    "openskill>=6.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pandas>=2.0",
    "langfuse>=3.0",
    "requests>=2.31",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# The local engine uses SQLite and does not import cloud SDKs. Install this
# extra only for the legacy DynamoDB rating-store adapter.
aws = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2a_engine"]
