name: a2a-comm

services:
  # Redis Streams is the operational event/recovery log. Append-only files
  # live in a named volume so a local worker crash does not erase replay input.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - a2a-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The default job is fully deterministic: it exercises every packaged environment,
  # writes to the shared SQLite volume, and makes no model or cloud requests.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: a2a-comm-runner:latest
    environment:
      A2A_TRACE_DB: /data/a2a.db
      # Local research runs retain the full OTel projection alongside the
      # canonical SQLite trace. Remote export is never required for replay.
      OTEL_TRACES_EXPORTER: file
      A2A_OTEL_TRACES_FILE: /data/otel-spans.jsonl
      A2A_CAPTURE_CONTENT: "true"
      A2A_REDIS_URL: redis://redis:6379/0
      # The default smoke job is replayable too; per-launch launches override
      # this namespace with their own immutable launch ID.
      A2A_LAUNCH_ID: compose-smoke
      A2A_REDIS_STREAM_PREFIX: a2a:launch:compose-smoke
      A2A_REDIS_STREAM_TTL_SECONDS: "604800"
      # Provider credentials are interpolated from the repo-root `.env` (or the
      # shell) and default to empty, so the credential-free smoke path still
      # starts with no `.env` present. Nothing is baked into the image.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    volumes:
      # The workspace is mounted read-only so an edit to a config or the agent
      # pool is picked up on the next request, with no rebuild. Everything the
      # stack writes goes to the data volume, never back into the repository.
      - ./:/workspace:ro
      - a2a-data:/data
    # The worker writes its run artifacts into a directory of its own. The
    # control plane never reads it -- evidence crosses through /data/artifacts
    # and nowhere else, so "read the runner's files" is structurally
    # unavailable rather than merely discouraged.
    command: ["a2a-run", "experiments/all_games_smoke.yaml", "--smoke-test",
              "--results-dir", "/data/worker-results"]
    depends_on:
      redis:
        condition: service_healthy

  # The browser dispatches digest-bound inputs through the artifact queue.
  # This service alone holds provider keys and executes unverified local work.
  worker:
    image: a2a-comm-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      A2A_REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./:/workspace:ro
      - a2a-data:/data
    command: ["python", "-m", "expt_runner.worker_service"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/data/artifacts/dispatch/presence.json').is_file()"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A local control plane with only published release data and static assets.
  # It tolerates an empty database before the first runner job completes.
  viewer:
    image: a2a-comm-control-plane:latest
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    environment:
      A2A_TRACE_DB: /data/a2a.db
      A2A_OTEL_TRACES_FILE: /data/otel-spans.jsonl
      A2A_REDIS_URL: redis://redis:6379/0
      A2A_CAPTURE_CONTENT: "true"
      A2A_LAUNCHER_BACKEND: worker_service
    volumes:
      - a2a-data:/data
    ports:
      - "8080:8080"
    command:
      ["python", "local_stack/server.py", "--database", "/data/a2a.db", "--workspace", "/workspace", "--artifact-root", "/data/artifacts", "--static-dir", "/opt/groundwork-web", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  a2a-data:
  a2a-redis:
