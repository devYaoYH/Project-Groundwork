# Shared agent pool.
#
# A logical name here binds to one concrete endpoint. Experiment configs name
# participants positionally:
#
#     participants: [gpt-mini, gpt-mini, haiku]
#
# and the binding supplies the model, wire format and credential. That split
# exists because the same logical agent reaches a different endpoint for
# different people — Claude through the Anthropic API, through OpenRouter, or
# through Vertex under ADC.
#
# To use your own routing, copy an entry into `agents.local.yaml` at the
# repository root and change it. That file is gitignored and shadows these
# defaults entry by entry, so shared configs stay portable.
#
# `credential` selects one access method: a named API key/token or Vertex ADC.
# It is an enum selector, never a secret value. Put values in .env/runtime secrets.

agents:
  gpt-mini:
    description: OpenAI platform, small general-purpose model.
    type: llm
    model: gpt-5-mini
    api_format: openai
    credential: OPENAI_API_KEY

  haiku:
    description: Claude Haiku 5.5 via OpenRouter.
    type: llm
    model: anthropic/claude-haiku-5.5
    api_format: openai
    api_base: https://openrouter.ai/api/v1
    credential: OPENROUTER_API_KEY
    capabilities:
      input: [text, image]
      evidence: https://openrouter.ai/anthropic/claude-haiku-5.5

  # Optional Vertex ADC route; the default Haiku binding uses OpenRouter.
  haiku-5.5-vertex:
    description: Claude Haiku 5.5 via Vertex AI, using Google ADC.
    type: llm
    model: claude-haiku-5-5
    api_format: vertexai_anthropic
    credential: vertexai_adc
    capabilities:
      input: [text, image]
      evidence: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/haiku-5-5
    config:
      gcp_location: global

  # --- OpenRouter -------------------------------------------------------
  # One key reaches many vendors, which makes it the cheap way to explore a
  # line-up before committing to a provider. Any OpenRouter model id works
  # here; copy an entry and change `model`. Check the id against OpenRouter's
  # catalogue first — a wrong id fails at the first call, not at load.
  ds-flash:
    description: DeepSeek V4 Flash via OpenRouter. Cheap; good default for playing around.
    type: llm
    model: deepseek/deepseek-v4-flash
    api_format: openai
    api_base: https://openrouter.ai/api/v1
    credential: OPENROUTER_API_KEY

  ds-v4.1-flash:
    description: DeepSeek V4.1 Flash via OpenRouter, with native text and image input.
    type: llm
    model: deepseek/deepseek-v4.1-flash
    api_format: openai
    api_base: https://openrouter.ai/api/v1
    credential: OPENROUTER_API_KEY
    capabilities:
      input: [text, image]
      evidence: https://openrouter.ai/deepseek/deepseek-v4.1-flash
    temperature: 0.2
    max_tokens: 4096

  # Keep the existing OpenRouter name for experiments that select it.
  # Both Haiku names now resolve to Haiku 5.5 through OpenRouter.
  haiku-or:
    description: Claude Haiku 5.5 via OpenRouter (alias of haiku).
    type: llm
    model: anthropic/claude-haiku-5.5
    api_format: openai
    api_base: https://openrouter.ai/api/v1
    credential: OPENROUTER_API_KEY
    capabilities:
      input: [text, image]
      evidence: https://openrouter.ai/anthropic/claude-haiku-5.5

  # Calls no provider, so it needs no credential. Useful for holding a seat in
  # a line-up while only some positions are model-backed.
  heuristic:
    description: Scripted opponent; no model, no spend.
    type: heuristic
