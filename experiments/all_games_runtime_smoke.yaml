name: all_games_runtime_smoke
description: Credential-free separate-container CLI and viewer rollout gate.
storage: {backend: sqlite, path: /data/a2a.db}
defaults:
  agents:
    - {id: first, type: scripted, runtime: external}
    - {id: second, type: scripted, runtime: external}
  join_timeout_s: 30
  turn_timeout_s: 15
cells:
  - label: word_guess
    count: 2
    config: {environment_id: word_guess, secret_word: dog, max_turns: 4, seed: 1}
  - label: buyer_seller
    count: 2
    config: {environment_id: buyer_seller, num_items: 1, seller_cost: 10, buyer_value: 40, max_rounds: 2, seed: 2}
  - label: calendar
    count: 2
    config: {environment_id: calendar, num_agents: 2, num_slots: 4, num_meetings: 2, density: 0, max_turns_per_round: 1, enable_reflection: true, reflection_frequency: environment, decision_retries: 0, seed: 3}
  - label: negotiation
    count: 2
    config: {environment_id: negotiation, num_rounds: 2, cheap_talk_turns: 1, seed: 4}
