# Deployment consumes validation outputs. Building or substituting images here
# would invalidate the guarantee that the deployed artifacts passed CI.
steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: validate-images
    entrypoint: bash
    args: ['deploy/run_python.sh', 'deploy/validated_images.py', 'check', '--project', '$PROJECT_ID', '--region', '${_REGION}', '--source-sha', '${_SOURCE_SHA}', '--validated-source-sha', '${_VALIDATED_SOURCE_SHA}', '--platform-image', '${_PLATFORM_IMAGE}', '--runtime-image', '${_RUNTIME_IMAGE}', '--runtime-source-sha', '${_RUNTIME_SOURCE_SHA}']
  - name: '${_PLATFORM_IMAGE}'
    id: publish-catalogue
    entrypoint: python
    args: ['-m', 'cloud_platform.publish_catalogue', '--project', '$PROJECT_ID', '--output', '.platform-build/catalogue-sha256']
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: publish
    entrypoint: bash
    args:
      - -c
      - |
        bash deploy/run_python.sh deploy/release.py --project '$PROJECT_ID' --region '${_REGION}' --image '${_PLATFORM_IMAGE}' --source-sha '${_SOURCE_SHA}' --runtime-image '${_RUNTIME_IMAGE}' --runtime-source-sha '${_RUNTIME_SOURCE_SHA}' --oauth-client-id '${_GOOGLE_OAUTH_CLIENT_ID}' --catalogue-sha256 "$$(cat .platform-build/catalogue-sha256)"
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    id: verify-hosted
    entrypoint: bash
    args: ['deploy/run_python.sh', 'deploy/verify_hosted.py', '--project', '$PROJECT_ID', '--region', '${_REGION}', '--source-sha', '${_SOURCE_SHA}', '--verify-runtime-bindings']
substitutions:
  _REGION: us-central1
  _SOURCE_SHA: ''
  _VALIDATED_SOURCE_SHA: ''
  _PLATFORM_IMAGE: ''
  _RUNTIME_IMAGE: ''
  _RUNTIME_SOURCE_SHA: ''
  _GOOGLE_OAUTH_CLIENT_ID: ''
serviceAccount: projects/$PROJECT_ID/serviceAccounts/groundwork-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
