[project]
name = "a2a-agent"
version = "0.1.0"
description = "Reference a2a-turns/1 scripted and structured-output agent runtime."
requires-python = ">=3.11"
dependencies = ["a2a-engine", "json-repair>=0.30"]

[project.scripts]
a2a-agent = "a2a_agent.server:main"
a2a-conformance = "a2a_agent.conformance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2a_agent"]

[tool.uv.sources]
a2a-engine = { path = "../a2a-engine", editable = true }
