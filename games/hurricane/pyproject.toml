[project]
name = "hurricane"
version = "0.1.0"
description = "Hurricane landfall: coastal managers pool instrument readings and order evacuations, for a2a-engine."
requires-python = ">=3.12"
dependencies = [
    "a2a-engine",
    "a2a-agent",
    "expt-runner",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Lets `a2a-run` discover the environment without the caller importing it first.
[project.entry-points."a2a_engine.environments"]
hurricane = "hurricane"

[project.entry-points."a2a_agent.seats"]
hurricane = "hurricane.seat_plugin:seat_plugin"

[tool.groundwork]
smoke_config = "tests/smoke.yaml"
browser_fixtures = "tests/browser/fixtures.yaml"
site_metadata = "catalogue.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hurricane"]

[tool.uv.sources]
a2a-agent = { path = "../../a2a-agent", editable = true }
a2a-engine = { path = "../../a2a-engine", editable = true }
expt-runner = { path = "../../expt-runner", editable = true }
