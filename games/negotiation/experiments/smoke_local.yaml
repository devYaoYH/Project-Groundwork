name: negotiation_smoke
description: >
  Heuristic-agent smoke test. It deliberately omits `storage:` to prove that a
  standalone Negotiation experiment selects its registered SQLite local-first
  default without API keys or cloud configuration.
defaults:
  environment_id: negotiation
  num_rounds: 2
  cheap_talk_turns: 2
  enable_cheap_talk: true
  agents:
    - {type: heuristic}
    - {type: heuristic}
cells:
  - label: smoke
    count: 2
    config: {seed: 7}
