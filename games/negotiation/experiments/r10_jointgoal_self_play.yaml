name: projects_study_collaborative_goal_self_play_010
description: >
  R10 collaborative-goal self-play intervention: 3 models x 4 paradigms x
  3 MC ratios x 10 games = 360 self-play games. Cheap talk remains enabled;
  agents are prompted to maximize joint combined reward via maximize_joint=true.
defaults:
  environment_id: negotiation
  preset: v2_projects
cells:
