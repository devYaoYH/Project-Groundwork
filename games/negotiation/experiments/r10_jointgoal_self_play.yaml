  count: 10
  config:
    mode: stable
    rotate_projects: false
    mc_ratio: 0.5
    maximize_joint: true
    enable_cheap_talk: true
    agents:
    - type: llm
      model: claude-sonnet-4-5
    - type: llm
      model: claude-sonnet-4-5
