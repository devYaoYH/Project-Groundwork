name: projects_study_sonnet_transparency_010
description: >
  R10 Sonnet 4.5 self-play full-transparency intervention. Completes the
  missing full-transparency slice for comparison against the existing Sonnet
  original, no-talk, and maximize-joint self-play grids:
  stable/shifting x fixed/rotate x M/C ratios x 10 games = 120 games.
defaults:
  environment_id: negotiation
  preset: v2_projects
cells:
- label: sonnet_stable_fixed_transparency_mc05
  count: 10
  config:
    mode: stable
    rotate_projects: false
    mc_ratio: 0.5
    full_transparency: true
    enable_cheap_talk: true
    agents:
    - type: llm
      model: claude-sonnet-4-5
    - type: llm
      model: claude-sonnet-4-5
