name: v2_projects_gemini31pro_smoke
description: 'Tiny smoke test for v2 projects using Gemini 3.1 Pro through Vertex AI ADC.'
defaults:
  game_name: negotiation
  preset: v2_projects
batches:
- label: gemini31pro_stable_rotate_share_named_tom_mc08_smoke
  count: 1
  config:
    num_rounds: 1
    cheap_talk_turns: 1
    mode: stable
    balance_turn_order: false
    consent: false
    vertex_adc_file: ${A2A_VERTEX_GEMINI_ADC_FILE}
    gcp_project: ${A2A_VERTEX_GEMINI_PROJECT}
    gcp_location: global
    rotate_projects: true
    enable_cheap_talk: true
    share_projects: true
    named_projects: true
    think_about_opponent: true
    mc_ratio: 0.8
    agents:
    - type: llm
      model: publishers/google/models/gemini-3.1-pro-preview
    - type: llm
      model: publishers/google/models/gemini-3.1-pro-preview
