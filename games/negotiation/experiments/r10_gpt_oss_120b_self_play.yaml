name: projects_study_gpt_oss_120b_self_play_010
description: >
  R10 GPT-OSS 120B MaaS self-play conditions: 1 model x 4 paradigms x
  3 MC ratios x 10 games x 2 goal framings = 240 self-play games.
  Includes both original self-play and joint-goal intervention conditions.
defaults:
  environment_id: negotiation
  preset: v2_projects
  vertex_adc_file: ${A2A_VERTEX_MAAS_ADC_FILE}
  gcp_project: ${A2A_VERTEX_MAAS_PROJECT}
  gcp_location: us-central1

cells:
- label: gptoss120b_selfplay_stable_fixed_mc05
  count: 10
  config: &stable_fixed_mc05
    mode: stable
    rotate_projects: false
    mc_ratio: 0.5
    agents: &gpt_oss_agents
    - type: llm
      model: openai/gpt-oss-120b-maas
      api_format: vertexai_openai
      max_tokens: 8192
    - type: llm
      model: openai/gpt-oss-120b-maas
      api_format: vertexai_openai
      max_tokens: 8192
- label: gptoss120b_selfplay_stable_fixed_mc08
  count: 10
  config:
    mode: stable
    rotate_projects: false
    mc_ratio: 0.8
    agents: *gpt_oss_agents
- label: gptoss120b_selfplay_stable_fixed_mc10
