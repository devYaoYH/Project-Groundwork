[project]
name = "negotiation-game"
version = "0.1.0"
description = "Multi-agent resource negotiation benchmark for a2a-engine."
requires-python = ">=3.11"
dependencies = [
    "a2a-engine",
    "expt-runner",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]
webapp = ["aiohttp>=3.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lets `a2a-run` discover the game without the caller importing it first.
[project.entry-points."a2a_engine.games"]
negotiation = "negotiation_game"

[tool.hatch.build.targets.wheel]
packages = ["negotiation_game", "negotiation_analysis", "negotiation_judge"]

[tool.uv.sources]
a2a-engine = { path = "../../a2a-engine", editable = true }
expt-runner = { path = "../../expt-runner", editable = true }
