<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Pool — run_009</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0f;--bg2:#14141a;--bg3:#1c1c26;--bg4:#242430;
  --tx:#c8cad0;--tx2:#8b8d96;--tx3:#55575e;
  --accent:#5b8af5;--green:#3dd68c;--red:#f0555a;--amber:#f0a03c;
  --border:#2a2a36;
  --radius:8px;
}
html{font-size:14px}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;line-height:1.5;min-height:100vh}
code,pre,.mono{font-family:'JetBrains Mono',monospace}

/* layout */
.shell{max-width:1320px;margin:0 auto;padding:24px 32px 80px}
header{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px}
header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;color:#fff}
header .meta{font-size:.8rem;color:var(--tx2)}
header .meta span{margin-right:12px}

/* bucket tabs */
.tabs{display:flex;gap:4px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:6px 16px;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;
  background:var(--bg3);color:var(--tx2);border:1px solid transparent;transition:.15s}
.tab:hover{background:var(--bg4);color:var(--tx)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .count{margin-left:6px;font-size:.75rem;opacity:.7}

/* summary bar */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.stat-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:2px}
.stat-card .value{font-size:1.3rem;font-weight:700;color:#fff}
.stat-card .sub{font-size:.75rem;color:var(--tx2);margin-top:2px}

/* scenario cards */
.scenarios{display:flex;flex-direction:column;gap:12px}
.scenario{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s}
.scenario:hover{border-color:var(--bg4)}
.scenario-head{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;padding:14px 18px;cursor:pointer;gap:16px}
.scenario-head .idx{font-size:1.1rem;font-weight:700;color:var(--tx3);text-align:center}
.scenario-head .info{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.scenario-head .info .tag{font-size:.8rem;color:var(--tx2)}
.scenario-head .info .tag b{color:var(--tx);font-weight:600}
.scenario-head .models{display:flex;gap:6px}
.model-pill{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.model-pill.pass{background:rgba(61,214,140,.12);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.model-pill.warn{background:rgba(240,160,60,.12);color:var(--amber);border:1px solid rgba(240,160,60,.25)}
.model-pill.fail{background:rgba(240,85,90,.1);color:var(--red);border:1px solid rgba(240,85,90,.2)}
.copy-btn{font-size:.7rem;font-weight:600;padding:4px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--tx2);cursor:pointer;transition:.15s;white-space:nowrap}
.copy-btn:hover{background:var(--bg4);color:var(--tx);border-color:var(--tx3)}
.copy-btn.copied{background:rgba(61,214,140,.12);color:var(--green);border-color:rgba(61,214,140,.3)}
.chevron{transition:.2s;color:var(--tx3);font-size:1.2rem}
.scenario.open .chevron{transform:rotate(90deg)}

/* expanded detail */
.scenario-body{display:none;border-top:1px solid var(--border);padding:18px;background:var(--bg)}
.scenario.open .scenario-body{display:block}

/* projects grid */
.players{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.player-box{background:var(--bg3);border-radius:var(--radius);padding:14px}
.player-box h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:8px}
.proj{font-size:.82rem;margin-bottom:4px;padding:4px 8px;background:var(--bg4);border-radius:4px}
.proj .pname{font-weight:600;color:#fff}
.proj .preq{color:var(--tx2)}
.proj .prew{color:var(--green);font-weight:600;float:right}

/* oracle stats row */
.oracle-stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:16px;font-size:.8rem;color:var(--tx2)}
.oracle-stats span b{color:var(--tx);font-weight:600}

/* oracle traces */
.oracle-traces{display:flex;flex-direction:column;gap:12px}
.trace-model{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.trace-model-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer}
.trace-model-head .mname{font-weight:600;font-size:.85rem}
.trace-model-head .mstatus{font-size:.75rem;font-weight:600}
.trace-model-body{display:none;border-top:1px solid var(--border)}
.trace-model.open .trace-model-body{display:block}

.attempt{padding:12px 14px;border-bottom:1px solid var(--border)}
.attempt:last-child{border-bottom:none}
.attempt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.attempt-head .anum{font-size:.8rem;font-weight:600;color:var(--tx2)}
.attempt-head .aresult{font-size:.8rem;font-weight:700}
.attempt-head .aresult.pass{color:var(--green)}
.attempt-head .aresult.fail{color:var(--red)}
.attempt-reasoning{font-size:.78rem;color:var(--tx2);margin-bottom:8px;line-height:1.5;
  max-height:80px;overflow:hidden;transition:.3s;cursor:pointer;position:relative}
.attempt-reasoning.expanded{max-height:none}
.attempt-reasoning::after{content:'';position:absolute;bottom:0;left:0;right:0;height:24px;
  background:linear-gradient(transparent,var(--bg2));pointer-events:none}
.attempt-reasoning.expanded::after{display:none}

.attempt-alloc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem}
.alloc-box{background:var(--bg3);border-radius:4px;padding:8px 10px}
.alloc-box .alabel{font-size:.7rem;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.alloc-box .aline{color:var(--tx2);margin-bottom:2px}
.alloc-box .aline b{color:var(--tx);font-weight:500}
.warnings{margin-top:6px}
.warn{font-size:.75rem;color:var(--amber);padding:2px 0}

/* responsive */
@media(max-width:800px){
  .players{grid-template-columns:1fr}
  .attempt-alloc{grid-template-columns:1fr}
  .scenario-head{grid-template-columns:36px 1fr}
  .scenario-head .models{grid-column:1/-1}
}
</style>
</head>

const meta = DATA.metadata || {};
const buckets = Object.keys(DATA).filter(k => k !== 'metadata').sort((a,b) => +a - +b);
let activeBucket = buckets[0];

// Header
document.getElementById('headerMeta').innerHTML = [
  meta.generated_at ? `<span>Generated ${new Date(meta.generated_at).toLocaleDateString()}</span>` : '',
  `<span>Budget $${meta.agent_budget}</span>`,
  `<span>Max ${meta.max_resource_types} types</span>`,
  `<span>k=${meta.k}</span>`,
  `<span>threshold=${(meta.pass_threshold*100).toFixed(0)}%</span>`,
].join('');

function renderTabs() {
  document.getElementById('tabs').innerHTML = buckets.map(b => {
    const n = (DATA[b] || []).length;
    return `<div class="tab ${b===activeBucket?'active':''}" onclick="selectBucket('${b}')">
      M/C ${(+b).toFixed(1)}<span class="count">(${n})</span>
    </div>`;
  }).join('');
}

function selectBucket(b) {
  activeBucket = b;
  renderTabs();
  renderScenarios();
}

function renderScenarios() {
  const scenarios = DATA[activeBucket] || [];
  if (!scenarios.length) {
    document.getElementById('summary').innerHTML = '';
    document.getElementById('scenarios').innerHTML = '<div style="color:var(--tx3);text-align:center;padding:40px">No validated scenarios for this bucket.</div>';
    return;
  }

  // Summary stats
  const mcVals = scenarios.map(s => s.oracle_stats?.mc_ratio || 0);
  const cVals = scenarios.map(s => s.oracle_stats?.combined || 0);
  const mVals = scenarios.map(s => s.oracle_stats?.collab_max || 0);
  const npVals = scenarios.map(s => s.oracle_stats?.negotiation_pressure || 0);
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;

  document.getElementById('summary').innerHTML = `
    <div class="stat-card"><div class="label">Scenarios</div><div class="value">${scenarios.length}</div></div>
    <div class="stat-card"><div class="label">Avg M/C</div><div class="value">${avg(mcVals).toFixed(3)}</div>
      <div class="sub">${Math.min(...mcVals).toFixed(3)} – ${Math.max(...mcVals).toFixed(3)}</div></div>
    <div class="stat-card"><div class="label">Avg C</div><div class="value">${avg(cVals).toFixed(0)}</div></div>
    <div class="stat-card"><div class="label">Avg M</div><div class="value">${avg(mVals).toFixed(0)}</div></div>
    <div class="stat-card"><div class="label">Avg Neg. Pressure</div><div class="value">${(avg(npVals)*100).toFixed(0)}%</div></div>
  `;

  document.getElementById('scenarios').innerHTML = scenarios.map((s, i) => {
    const os = s.oracle_stats || {};
    const models = s.oracle_summary || {};
    const sid = s.candidate_id;
    const modelPills = Object.entries(models).map(([m, r]) => {
      const short = m.replace('claude-haiku-4-5-20251001','haiku').replace('gemini-2.5-flash','gemini').replace('gpt-4o','gpt-4o');
      const mi = modelInfo(activeBucket, sid, m);
      const icon = mi.status === 'fail' ? '✗' : mi.status === 'warn' ? '⚠' : '✓';
      return `<span class="model-pill ${mi.status}">${short} ${icon} ${mi.bestScore}</span>`;
    }).join('');

    return `<div class="scenario" id="sc-${i}">
      <div class="scenario-head" onclick="toggleScenario(${i})">
        <div class="idx">${i+1}</div>
        <div class="info">
          <span class="tag">M/C <b>${(os.mc_ratio||0).toFixed(3)}</b></span>
          <span class="tag">C=<b>${os.combined}</b></span>
          <span class="tag">M=<b>${os.collab_max}</b></span>
          <span class="tag">V1=<b>${os.v1}</b> V2=<b>${os.v2}</b></span>
          <span class="tag">Paths <b>${os.optimal_paths||'?'}</b></span>
          <span class="tag">NP <b>${((os.negotiation_pressure||0)*100).toFixed(0)}%</b></span>
          ${modelPills}
        </div>
        <button class="copy-btn" onclick="event.stopPropagation();copyConfig('${activeBucket}',${i},this)">Copy Config</button>
        <span class="chevron">›</span>
      </div>
      <div class="scenario-body" id="sb-${i}"></div>
    </div>`;
  }).join('');
}

function toggleScenario(i) {
  const el = document.getElementById('sc-' + i);
  const isOpen = el.classList.toggle('open');
  if (isOpen) renderScenarioBody(i);
}

function renderScenarioBody(i) {
  const s = DATA[activeBucket][i];
  const os = s.oracle_stats || {};
  const ap = s.agent_projects || [[],[]];
  const cid = s.candidate_id;
  const logKey = `${activeBucket}/${cid}`;
  const oracleLog = ORACLE_LOGS[logKey];

  const projHTML = (projs, label) => {
    const cards = projs.map(p => {
      const reqs = Object.entries(p.requirements).map(([r,q]) => `${r}×${q}`).join(' + ');
      return `<div class="proj"><span class="pname">${p.name}</span> <span class="preq">[${reqs}]</span><span class="prew">${p.reward}/run</span></div>`;
    }).join('');
    return `<div class="player-box"><h4>${label}</h4>${cards}</div>`;
  };

  let tracesHTML = '<div style="color:var(--tx3);font-size:.8rem">No oracle logs available</div>';
  if (oracleLog && oracleLog.model_results) {
    tracesHTML = Object.entries(oracleLog.model_results).map(([model, mr]) => {
      const short = model.replace('claude-haiku-4-5-20251001','haiku').replace('gemini-2.5-flash','gemini');
      const attempts = mr.attempts || [];
      const cleanPasses = attempts.filter(a => a.passed && (a.warnings || []).length === 0);
      const hasCleanPass = cleanPasses.length > 0;
      const statusClass = !mr.passed ? 'red' : hasCleanPass ? 'green' : 'amber';
      const statusText = !mr.passed ? '✗ FAIL' : hasCleanPass ? '✓ PASS' : '⚠ WARN';
      const displayBest = hasCleanPass ? Math.max(...cleanPasses.map(a => a.combined)) : mr.best_score;
      const attemptsHTML = (mr.attempts || []).map(a => {
        const aClass = a.passed ? 'pass' : 'fail';
        const aText = a.passed ? `PASS (${a.combined})` : `FAIL (${a.combined})`;
        const p1 = a.player1 || {};
        const p2 = a.player2 || {};
        const warnHTML = (a.warnings||[]).length
          ? `<div class="warnings">${a.warnings.map(w=>`<div class="warn">⚠ ${w}</div>`).join('')}</div>` : '';

        const allocBox = (label, p) => {
          if (!p.purchases) return '';
          const purch = Object.entries(p.purchases||{}).filter(([,v])=>v>0).map(([r,v])=>`<div class="aline"><b>${r}</b>: ${v}</div>`).join('');
          const runs = Object.entries(p.project_runs||{}).filter(([,v])=>v>0).map(([n,v])=>`<div class="aline"><b>${n}</b> ×${v}</div>`).join('');
          return `<div class="alloc-box"><div class="alabel">${label} — reward ${p.reward||0} (spent $${(p.spent||0).toFixed(1)})</div>${purch}${runs}</div>`;
        };

        return `<div class="attempt">
          <div class="attempt-head">
            <span class="anum">Attempt ${a.attempt} · ${(a.duration_s||0).toFixed(1)}s</span>
            <span class="aresult ${aClass}">${aText}</span>
          </div>
          ${a.reasoning ? `<div class="attempt-reasoning" onclick="this.classList.toggle('expanded')">${a.reasoning}</div>` : ''}
          <div class="attempt-alloc">${allocBox('Player 1', p1)}${allocBox('Player 2', p2)}</div>
          ${warnHTML}
        </div>`;
      }).join('');

      return `<div class="trace-model" id="tm-${i}-${short}">
        <div class="trace-model-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="mname">${model}</span>
          <span class="mstatus" style="color:var(--${statusClass})">${statusText} · best=${displayBest}</span>
        </div>
        <div class="trace-model-body">${attemptsHTML}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('sb-' + i).innerHTML = `
    <div class="players">${projHTML(ap[0], 'Player A')}${projHTML(ap[1], 'Player B')}</div>
    <div class="oracle-stats">
      <span>Swap Fair: <b>${os.swap_fairness!=null?(os.swap_fairness*100).toFixed(0)+'%':'—'}</b></span>
      <span>ASC: <b>${os.asc1||'?'}</b> / <b>${os.asc2||'?'}</b></span>
      <span>Solo Overlap: <b>${os.solo_overlap!=null?(os.solo_overlap*100).toFixed(0)+'%':'?'}</b></span>
      <span>Collab Diverge: <b>${os.collab_divergence!=null?(os.collab_divergence*100).toFixed(0)+'%':'?'}</b></span>
      <span>Collab Plan: <b>${os.collab_detail||'—'}</b></span>
      ${s.scenario_synergy ? `<span>Synergy: <b>+${s.scenario_synergy.bonus} if ${s.scenario_synergy.resource} ≥ ${s.scenario_synergy.threshold}</b></span>` : ''}
    </div>
    <h4 style="font-size:.8rem;color:var(--tx3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Oracle Traces</h4>
    <div class="oracle-traces">${tracesHTML}</div>
  `;
}

function copyConfig(bucket, idx, btn) {
  const s = DATA[bucket][idx];
  const payload = {agent_projects: s.agent_projects, oracle_stats: s.oracle_stats};
  if (s.scenario_synergy) payload.scenario_synergy = s.scenario_synergy;
  navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Config'; btn.classList.remove('copied'); }, 1500);
  });
}

function modelInfo(bucket, candidateId, model) {
  const logKey = `${bucket}/${candidateId}`;
  const log = ORACLE_LOGS[logKey];
  if (!log || !log.model_results || !log.model_results[model]) return {status:'fail', bestScore:0};
  const mr = log.model_results[model];
  if (!mr.passed) return {status:'fail', bestScore: mr.best_score || 0};
  const attempts = mr.attempts || [];
  const cleanPasses = attempts.filter(a => a.passed && (a.warnings || []).length === 0);
  if (cleanPasses.length > 0) {
    return {status:'pass', bestScore: Math.max(...cleanPasses.map(a => a.combined))};
  }
  const allPasses = attempts.filter(a => a.passed);
  return {status:'warn', bestScore: allPasses.length ? Math.max(...allPasses.map(a => a.combined)) : mr.best_score || 0};
}

renderTabs();
renderScenarios();
</script>
</body>
</html>
