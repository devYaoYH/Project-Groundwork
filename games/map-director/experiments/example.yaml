schema_version: 1
name: map_director_smoke
description: Two-round same-dyad multimodal route grounding with missing/renamed and
  duplicated landmarks.
release: ../environments/map_director_tiny_v1.yaml
agents:
- role: giver
  type: llm
  model: deepseek/deepseek-v4.1-flash
  api_format: openai
  temperature: 0.1
  max_tokens: 1800
  capabilities: &id001
    input:
    - text
    - image
    evidence: https://openrouter.ai/deepseek/deepseek-v4.1-flash
  config:
    api_base: https://openrouter.ai/api/v1
- role: follower
  type: llm
  model: deepseek/deepseek-v4.1-flash
  api_format: openai
  temperature: 0.1
  max_tokens: 1800
  capabilities: *id001
  config:
    api_base: https://openrouter.ai/api/v1
episodes:
- label: discrepant_pair
  count: 1
  seeds:
  - 17
storage:
  backend: sqlite
  path: ./results/map_director_smoke.db
observability:
  capture_content: true
