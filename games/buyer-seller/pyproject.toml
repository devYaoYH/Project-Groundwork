[project]
name = "buyer-seller"
version = "0.1.0"
description = "Sequential multi-item bargaining under asymmetric information, for a2a-engine."
requires-python = ">=3.11"
dependencies = [
    "a2a-engine",
    "expt-runner",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Declaring this entry point is what lets `a2a-run` find the game without the
# caller importing it. See a2a_engine.registry.ENTRY_POINT_GROUP.
[project.entry-points."a2a_engine.games"]
buyer_seller = "buyer_seller"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buyer_seller"]

[tool.uv.sources]
a2a-engine = { path = "../../a2a-engine", editable = true }
expt-runner = { path = "../../expt-runner", editable = true }
