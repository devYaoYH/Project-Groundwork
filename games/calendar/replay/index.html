<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar stream replay</title>
<style>
  :root { --paper:#f1f3f0; --card:#fff; --ink:#191c1a; --muted:#6b716d; --rule:#dcdfda; --accent:#33556e; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#15171a; --card:#1c1f22; --ink:#e8eae7; --muted:#9aa09c; --rule:#2e3235; --accent:#8fb4d0; }
  }
  body { background: var(--paper); color: var(--ink); font: 14px/1.55 "IBM Plex Sans","Segoe UI",sans-serif; margin: 0; }
  a { color: var(--accent); }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 500; }
  main { max-width: 760px; margin: 48px auto; padding: 0 20px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; background: var(--card); border: 1px solid var(--rule); color: var(--ink); }
  button { padding: 8px 14px; margin-top: 12px; background: var(--card); border: 1px solid var(--rule); color: var(--ink); cursor: pointer; }
  .muted { color: var(--muted); }
</style>
</head>
<body data-environment="calendar">
<main>
  <a href="/episodes/">← Episodes</a>
  <h1>Calendar stream replay</h1>
  <p class="muted">
    Replays a launch's Redis event stream through Calendar's own trace viewer.
    An episode that is still running renders as far as it has got.
  </p>
  <label for="stream">Redis stream</label>
  <input id="stream" placeholder="a2a:launch:…:episode:…">
  <button id="open">Open in Calendar viewer</button>
  <p id="status" class="muted"></p>
</main>
<script type="module">
// Calendar ships a full trace viewer that already accepts `?trace=<url>`, so
// the replay path is a projection of the stream into the trace shape it reads.
// Nothing about the viewer needs to know the trace came from Redis.
const params = new URLSearchParams(location.search);
const input = document.getElementById("stream");
const status = document.getElementById("status");

function viewerUrl(stream) {
  const trace = `/api/streams/${encodeURIComponent(stream)}/trace`;
  return `/environment-assets/calendar/tasks/viewer.html?trace=${encodeURIComponent(trace)}`;
}

// Calendar is the one replay page with no cursor of its own to drive: it hands
// the stream to Calendar's viewer and navigates away, so this page no longer
// exists by the time a host frame would post one. It is therefore not mounted
// beside the standard lane view, and deliberately registers no cursor listener
// rather than an inert one.

async function open_(stream) {
  if (!stream) { status.textContent = "Enter a stream id."; return; }
  status.textContent = "Projecting stream…";
  try {
    const response = await fetch(`/api/streams/${encodeURIComponent(stream)}/trace`);
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    const { partial, event_count } = payload.projection;
    status.textContent = partial
      ? `Episode still running — replaying ${event_count} events so far.`
      : `Episode complete — replaying ${event_count} events.`;
    location.href = viewerUrl(stream);
  } catch (error) {
    status.textContent = error.message;
  }
}

document.getElementById("open").addEventListener("click", () => open_(input.value.trim()));

const stream = params.get("stream");
if (stream) { input.value = stream; open_(stream); }
</script>
</body>
</html>
