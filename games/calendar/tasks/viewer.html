      <div class="text-xs font-mono font-semibold text-term-muted uppercase tracking-wider mb-3">Per-Agent Stats</div>
      <table class="w-full text-xs font-mono border border-term-border rounded overflow-hidden">
        <thead>
          <tr class="bg-term-panel text-term-muted text-[10px] uppercase">
            <th class="text-left px-3 py-2">Agent</th>
            <th class="text-right px-3 py-2">Cost</th>
            <th class="text-right px-3 py-2">Msg Sent</th>
            <th class="text-right px-3 py-2">Msg Recv</th>
            <th class="text-right px-3 py-2">Retries</th>
          </tr>
        </thead>
        <tbody>
          ${perAgentCost.map((c, i) => `
            <tr class="border-t border-term-border/50 hover:bg-term-panel/50 transition-colors">
              <td class="px-3 py-2 text-term-cyan">Agent ${i}</td>
              <td class="px-3 py-2 text-right text-term-amber font-semibold">${c}</td>
              <td class="px-3 py-2 text-right text-term-text">${agentMsgSent[i] || 0}</td>
              <td class="px-3 py-2 text-right text-term-text">${agentMsgRecv[i] || 0}</td>
              <td class="px-3 py-2 text-right ${(agentRetries[i]||0) > 0 ? 'text-term-red' : 'text-term-muted'}">${agentRetries[i] || 0}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
  }

  // Round outcomes table
  const roundOutcomes = fs.round_outcomes || [];
  const resolutionEvents = S.events.filter(e => e.type === 'resolution');
  if (resolutionEvents.length) {
    html += `<div>
      <div class="text-xs font-mono font-semibold text-term-muted uppercase tracking-wider mb-3">Resolution Results</div>
      <table class="w-full text-xs font-mono border border-term-border rounded overflow-hidden">
        <thead>
          <tr class="bg-term-panel text-term-muted text-[10px] uppercase">
            <th class="text-left px-3 py-2">Meeting</th>
            <th class="text-right px-3 py-2">Coordinated</th>
            <th class="px-3 py-2">Per-Agent Slots</th>
          </tr>
        </thead>
        <tbody>
          ${resolutionEvents.map(ev => {
            const d = ev.data || {};
            const coord = d.coordinated;
            const slots = Object.entries(d.per_agent_slot || {}).map(([a,s]) => `A${a}→S${s}`).join(', ');
            return `<tr class="border-t border-term-border/50 hover:bg-term-panel/50 transition-colors">
              <td class="px-3 py-2 text-term-bright">M${d.meeting_id}</td>
              <td class="px-3 py-2 text-right">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${coord ? 'bg-term-greenDim text-term-green' : 'bg-term-redDim text-term-red'}">
                  ${coord ? '✓ YES' : '✗ NO'}
                </span>
              </td>
              <td class="px-3 py-2 text-term-muted">${esc(slots)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }

  html += `</div>`;
  metricsContent.innerHTML = html;
}

function costBar(label, val, max, color) {
  const pctWidth = Math.round((val / max) * 100);
  return `<div class="flex items-center gap-3">
    <span class="w-20 text-[10px] font-mono text-term-muted text-right shrink-0">${esc(label)}</span>
    <div class="flex-1 h-5 bg-term-panel rounded overflow-hidden border border-term-border/50">
      <div class="bar-fill h-full rounded" style="width:${pctWidth}%;background:${color}"></div>
    </div>
    <span class="w-6 text-[11px] font-mono text-term-text shrink-0">${val}</span>
  </div>`;
}

// ============================================================
// UTILS
// ============================================================
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

// ============================================================
// THEME TOGGLE
// ============================================================
const themeToggle = $('theme-toggle');

(function initTheme() {
  const saved = localStorage.getItem('caltrace-theme') || 'dark';
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  syncThemeBtn();
})();

themeToggle.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('caltrace-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('caltrace-theme', 'light');
  }
  syncThemeBtn();
});

function syncThemeBtn() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  themeToggle.textContent = isLight ? '☾ DARK' : '☀ LIGHT';
}

// ============================================================
// INIT
// ============================================================
// Nothing to do on load — wait for file
updateNavButtons();
</script>

</html>
