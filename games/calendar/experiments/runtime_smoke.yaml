name: calendar_runtime_smoke
storage: {backend: sqlite, path: /data/a2a.db}
defaults:
  environment_id: calendar
  num_agents: 2
  num_slots: 4
  num_meetings: 2
  density: 0
  max_turns_per_round: 1
  decision_retries: 0
  enable_reflection: true
  reflection_frequency: environment
  seed: 3
  agents:
    - {id: first, type: scripted, runtime: external}
    - {id: second, type: scripted, runtime: external}
cells:
  - {label: isolated, count: 2}
