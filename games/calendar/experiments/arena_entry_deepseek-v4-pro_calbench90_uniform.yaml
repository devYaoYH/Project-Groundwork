name: arena_entry_deepseek-v4-pro_calbench90_uniform
description: Arena entry calibration for deepseek/deepseek-v4-pro. Runs the fixed CalBench 90 uniform suite with the entrant
  in seat 0 and a static four-model anchor panel.
defaults:
  game_name: calendar
  task_path: tasks/calbench_90_uniform.jsonl
  num_agents: 5
  num_slots: 16
  num_meetings: 5
  num_participants: 3
  max_turns_per_round: 100
  dm_cap: 100
  decision_retries: 1
  enable_fallback: false
  communication_protocol: all
  enable_reflection: true
  reflection_frequency: round
  reflection_max_parallelism: 20
  agents:
  - type: llm
    model: deepseek/deepseek-v4-pro
    temperature: 0.0
    max_tokens: 1024
  - type: llm
    model: publishers/google/models/gemini-3-flash-preview
    temperature: 0.0
    max_tokens: 1024
    api_format: vertexai
    gcp_project: ${A2A_VERTEX_GEMINI_PROJECT}
    gcp_location: global
    vertex_adc_file: ${A2A_VERTEX_GEMINI_ADC_FILE}
  - type: llm
    model: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 1024
    api_format: vertexai_anthropic
    gcp_project: ${A2A_VERTEX_ANTHROPIC_PROJECT}
    gcp_location: global
    vertex_adc_file: ${A2A_VERTEX_ANTHROPIC_ADC_FILE}
  - type: llm
    model: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 1024
    api_format: openai
  - type: llm
    model: publishers/google/models/gemini-3.1-pro-preview
    temperature: 0.0
    max_tokens: 1024
    api_format: vertexai
    gcp_project: ${A2A_VERTEX_GEMINI_PROJECT}
    gcp_location: global
    vertex_adc_file: ${A2A_VERTEX_GEMINI_ADC_FILE}
