name: word_guess_example
description: Two cells, one per secret word, with default max_turns.
defaults:
  environment_id: word_guess
  num_agents: 2
  max_turns: 10
  agents:
    - type: llm
      model: gpt-4o-mini
    - type: llm
      model: anthropic/claude-haiku-5.5
      api_format: openai
      api_base: https://openrouter.ai/api/v1
      credential: OPENROUTER_API_KEY
cells:
  - label: dog
    count: 1
    config:
      secret_word: dog
      seed: 1
  - label: apple
    count: 1
    config:
      secret_word: apple
      seed: 2
