name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The mirrored client validator has no server to catch its mistakes, and
      # a half-written document must never throw in the editor.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      - run: >-
          uv pip install -e a2a-engine -e a2a-judge -e expt-runner
          -e games/buyer-seller -e games/calendar -e games/negotiation -e games/word-guess
      - run: >-
          uv run pytest a2a-engine/tests a2a-judge/tests expt-runner/tests
          games/buyer-seller/tests games/calendar/calendar_game/tests games/calendar/tests
          games/negotiation/tests games/word-guess/tests local_stack/tests
        env:
          PYTHONPATH: games/negotiation
      - run: uv run a2a-run experiments/all_games_smoke.yaml --smoke-test
      - name: Verify every reviewed environment runtime release
        run: |
          for release in games/*/runtime/release.json; do
            name="$(basename "$(dirname "$(dirname "$release")")")"
            uv run python scripts/run_game_runtime.py --release "$release" \
              --smoke-test --storage-path "/tmp/${name}-runtime.db"
          done
      - run: python scripts/release_check.py
      - run: docker compose config
      - run: |
          for package in a2a-engine a2a-judge expt-runner games/buyer-seller games/calendar games/negotiation games/word-guess; do
            uv build "$package" --out-dir dist
          done

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the cloud-free viewer
        run: docker compose up --build --detach --wait viewer
      - name: Run all-environment SQLite smoke job
        run: docker compose run --rm runner
      - name: Run typed Calendar episode and materialize its post-episode metric
        run: |
          docker compose run --rm runner \
            a2a-run games/calendar/experiments/typed_local_smoke.yaml \
            --smoke-test --max-parallelism 1 --results-dir /data \
            --storage-path /data/a2a.db
          docker compose run --rm runner \
            python scripts/materialize_metrics.py \
            --database /data/a2a.db --environment calendar
      - name: Verify researcher design lock and smoke launch
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8080"
          design_text = Path("local_stack/tests/buyer_seller_design_smoke.yaml").read_text()

          def request(path, body=None):
              request = Request(
                  base + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Content-Type": "application/json"},
                  method="POST" if body is not None else "GET",
              )
              with urlopen(request) as response:
                  return response.status, json.load(response)

          status, validation = request("/api/designs/validate", {
              "release_id": "buyer_seller", "design_text": design_text,
          })
          assert status == 200 and validation["valid"]
          status, experiment = request("/api/experiments", {
              "name": "CI buyer-seller design", "release_id": "buyer_seller",
              "design_text": design_text,
          })
          assert status == 201
          status, locked = request(f"/api/experiments/{experiment['id']}/lock", {
              "design_sha256": experiment["design_sha256"],
          })
          assert status == 200 and locked["locked_at"]
          status, launch = request("/api/launches", {
              "experiment_id": experiment["id"], "mode": "smoke",
          })
          assert status == 202
          for _ in range(100):
              _, launch_detail = request(f"/api/launches/{launch['id']}")
              if launch_detail["launch"]["status"] in {"COMPLETED", "FAILED", "CANCELLED"}:
                  break
              time.sleep(0.1)
          assert launch_detail["launch"]["status"] == "COMPLETED"
          _, episodes = request(f"/api/episodes?experiment_id={experiment['id']}")
          assert len(episodes["episodes"]) == 2
          for episode in episodes["episodes"]:
              _, trace = request(f"/api/episodes/{episode['episode_uid']}")
              provenance = trace["config"]["provenance"]
              assert provenance["experiment_id"] == experiment["id"]
              assert provenance["cell_id"] == episode["cell_id"]
              assert provenance["design_sha256"] == locked["design_sha256"]
              assert set(provenance["item_attributes"]) == {"seller_cost"}
              assert trace["config"]["discount_factor"] in {0.5, 1.0}
          PY
      - name: Verify trace, OTel, artifact, and leaderboard APIs
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8080"
          health = json.load(urlopen("http://127.0.0.1:8080/api/health"))
          assert health["ok"] is True
          assert health["episode_count"] >= 5
          environments = json.load(urlopen(f"{base}/api/environments"))["environments"]
          assert {environment["environment_id"] for environment in environments} == {
              "buyer_seller", "calendar", "negotiation", "word_guess"
          }
          calendar_environment = json.load(urlopen(f"{base}/api/environments/calendar"))
          assert calendar_environment["parameters"]
          assert calendar_environment["measures"]
          parameters = {
              parameter["name"]: parameter
              for parameter in calendar_environment["parameters"]
          }
          # Item-sourced levels are projected from the pinned bank; design-sourced
          # ones keep the domain the declaration wrote.
          density = parameters["density"]
          assert density["source"] == "item"
          assert density["levels"] and all(
              level["count"] >= 1 for level in density["levels"]
          )
          assert parameters["communication_protocol"]["source"] == "design"
          assert parameters["communication_protocol"]["levels"] is None
          negotiation_environment = json.load(urlopen(f"{base}/api/environments/negotiation"))
          mc_ratio = next(
              parameter for parameter in negotiation_environment["parameters"]
              if parameter["name"] == "mc_ratio"
          )
          assert mc_ratio["item_key"] == "mc_bucket"
          assert [level["value"] for level in mc_ratio["levels"]] == [0.5, 0.8, 1.0]
          static_head = urlopen(Request(f"{base}/environments/", method="HEAD"))
          assert static_head.status == 200
          assert static_head.headers["Content-Type"] == "text/html"
          assert static_head.read() == b""
          api_head = urlopen(Request(f"{base}/api/health", method="HEAD"))
          assert api_head.status == 200
          assert api_head.headers["Content-Type"] == "application/json; charset=utf-8"
          assert api_head.read() == b""
          calendar_items = json.load(urlopen(f"{base}/api/environments/calendar/items"))
          assert calendar_items["items"]
          assert (
              calendar_items["item_bank_sha256"]
              == calendar_environment["release"]["item_bank_sha256"]
          )
          listing = json.load(urlopen(f"{base}/api/episodes"))
          episodes = listing["episodes"]
          assert "next_cursor" in listing
          calendar = next(
              trace for trace in episodes
              if trace["environment_id"] == "calendar"
          )
          # Identity and provenance are promoted to real columns, so the list
          # is a filtered SQL query rather than a full-corpus rehydration.
          assert calendar["experiment_name"]
          assert calendar["cell_id"]
          assert calendar["attempt"] >= 1
          assert calendar["seed"] is not None
          assert calendar["status"] == "COMPLETED"
          filtered = json.load(
              urlopen(f"{base}/api/episodes?environment_id=calendar&limit=1")
          )["episodes"]
          assert len(filtered) == 1
          assert filtered[0]["environment_id"] == "calendar"
          episode_uid = calendar["episode_uid"]
          trace = json.load(urlopen(f"{base}/api/episodes/{episode_uid}"))
          assert trace["release"]["content_sha256"]
          assert trace["episode"]["id"]
          # The durable copy of provenance travels inside the trace: a record
          # read without the control plane still says what produced it.
          provenance = trace["config"]["provenance"]
          assert provenance["item_bank_sha256"]
          assert provenance["oracle_version"] == "cp-sat-v1"
          assert provenance["release_id"] == "calendar"
          assert provenance["cell_id"] == calendar["cell_id"]
          assert provenance["seed"] == calendar["seed"]
          # No design object exists yet; a hand-written config keeps this shape.
          assert provenance["experiment_id"] is None
          assert provenance["design_sha256"] is None
          artifacts = json.load(urlopen(f"{base}/api/episodes/{episode_uid}/artifacts"))
          assert any(
              artifact["kind"] == "derived_metrics.calendar.score_margin"
              for artifact in artifacts["artifacts"]
          )
          otel = json.load(urlopen(f"{base}/api/episodes/{episode_uid}/observability"))
          assert otel["span_count"] > 0
          board = json.load(urlopen(f"{base}/api/leaderboards/calendar"))
          assert board["metadata"]["source"] == "completed_trace_replay"
          assert board["metadata"]["rating_event_count"] >= 1
          assert board["leaderboard"]
          redis_replay = json.load(urlopen(
              f"{base}/api/streams/a2a%3Alaunch%3Acompose-smoke%3Aepisode%3Aall_games_smoke.word_guess.0"
          ))
          assert redis_replay["available"] is True
          assert redis_replay["events"]
          PY
      - name: Tear down local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
