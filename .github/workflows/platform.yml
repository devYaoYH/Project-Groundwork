name: Platform release
on:
  pull_request:
    paths: ['cloud_platform/**', 'tests/platform/**', 'deploy/**', 'compose.platform.yml', 'Dockerfile.platform', 'Dockerfile.runtime', 'requirements-platform.txt', 'cloudbuild.yaml', 'scripts/install_workspace.py', 'scripts/workspace.py', 'scripts/export_environment_ids.py', 'scripts/export_catalogue.py', 'a2a-engine/**', 'a2a-agent/**', 'a2a-judge/**', 'expt-runner/**', 'games/**', 'experiments/**', 'web/**', '.github/workflows/platform.yml', '.github/actions/**', '.github/ci/**']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Measure candidate build, GitHub validation and promotion without hosted rollout'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv venv
      - run: uv pip install -r requirements-platform.txt
      - run: uv run python scripts/install_workspace.py
      - run: uv run python scripts/export_environment_ids.py
      - run: uv run python -m pytest cloud_platform/tests tests/platform -q --durations=30 --junitxml=results/ci/platform.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-timings
          path: results/ci/*.xml

  platform-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify the immutable scientific source
        id: runtime-source
        run: |
          runtime_source_sha="$(git log -1 --format=%H -- Dockerfile.runtime scripts/install_workspace.py scripts/workspace.py a2a-engine a2a-agent a2a-judge expt-runner games experiments)"
          test -n "$runtime_source_sha"
          echo "sha=$runtime_source_sha" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      - name: Build candidates and caches in Cloud Build
        id: cloud-build
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SOURCE_SHA: ${{ github.sha }}
          RUNTIME_SOURCE_SHA: ${{ steps.runtime-source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python deploy/latency.py submit build --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --source-sha "$SOURCE_SHA" --runtime-source-sha "$RUNTIME_SOURCE_SHA"
      - name: Download the exact Cloud Build candidates
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          SOURCE_SHA: ${{ github.sha }}
          RUNTIME_SOURCE_SHA: ${{ steps.runtime-source.outputs.sha }}
          BUILD_ID: ${{ steps.cloud-build.outputs.build-id }}
        run: |
          python deploy/latency.py run artifact-download python deploy/cloud_images.py pull \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --source-sha "$SOURCE_SHA" \
            --runtime-source-sha "$RUNTIME_SOURCE_SHA" --build-id "$BUILD_ID"
      - uses: ./.github/actions/build-image
        if: github.event_name == 'pull_request' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        with:
          targets: platform
          cache-write: "true"
      - name: Verify image promotion against a disposable registry
        run: python .github/ci/verify_image_promotion.py
      - name: Record the images entering validation
        if: github.event_name == 'pull_request' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNTIME_SOURCE_SHA: ${{ steps.runtime-source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python deploy/validated_images.py record --source-sha "$SOURCE_SHA" \
            --runtime-source-sha "$RUNTIME_SOURCE_SHA"
      - run: docker compose -f compose.platform.yml config --quiet
      - name: Verify the paired local worker and science runtime
        run: |
          python deploy/latency.py run compose-start docker compose -f compose.platform.yml up --no-build --detach --wait
          python deploy/latency.py run compose-verification docker compose -f compose.platform.yml exec -T api python deploy/verify_local.py --url http://localhost:8080
      - name: Stop the verification stack
        if: always()
        run: docker compose -f compose.platform.yml down
      - name: Test the release images without rebuilding
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: |
          python deploy/latency.py run platform-image-tests docker run --rm groundwork-platform:local python -m pytest cloud_platform/tests tests/platform -q
          if ! test -e .platform-build/runtime-existing; then
            python deploy/latency.py run science-smoke docker run --rm groundwork-runtime:local python scripts/workspace.py smoke \
              --max-parallelism 1 --results-dir /tmp/science-smoke --storage-path /tmp/science-smoke/a2a.db
          fi
      - name: Verify validation did not replace either image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python deploy/validated_images.py verify --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-images
          path: .platform-build/*.json
          include-hidden-files: true

  validate:
    if: always()
    needs: [platform-tests, platform-stack]
    runs-on: ubuntu-latest
    steps:
      - run: test "$TEST_RESULT" = success && test "$STACK_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.platform-tests.result }}
          STACK_RESULT: ${{ needs.platform-stack.result }}

  deploy:
    if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    needs: [validate, platform-stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/download-artifact@v4
        with:
          name: validated-images
          path: .platform-build
      - name: Publish the validated artifacts through Cloud Build
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLISH_ONLY: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: |
          runtime_source_sha="$(python -c 'import json; print(json.load(open(".platform-build/validated-images.json"))["runtime_source_sha"])')"
          args=()
          if test "$PUBLISH_ONLY" = true; then args+=(--publish-only); fi
          python deploy/latency.py submit publish --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --source-sha "$SOURCE_SHA" --runtime-source-sha "$runtime_source_sha" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-publish-timings
          path: .platform-build/cloud-publish.json
          include-hidden-files: true

  latencies:
    if: always()
    needs: [platform-tests, platform-stack, validate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*images'
          path: results/latencies
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*timings'
          path: results/latencies
          merge-multiple: true
      - name: Record runner queues and stage durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ci/report_latencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-latencies
          path: results/latencies
