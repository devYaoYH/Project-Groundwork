name: Platform release
on:
  pull_request:
    paths: ['cloud_platform/**', 'tests/platform/**', 'deploy/**', 'compose.platform.yml', 'Dockerfile.platform', 'Dockerfile.runtime', 'requirements-platform.txt', 'cloudbuild.yaml', 'scripts/install_workspace.py', 'scripts/workspace.py', 'scripts/export_environment_ids.py', 'scripts/export_catalogue.py', 'a2a-engine/**', 'a2a-agent/**', 'a2a-judge/**', 'expt-runner/**', 'games/**', 'experiments/**', 'web/**', '.github/workflows/platform.yml', '.github/actions/**']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv venv
      - run: uv pip install -r requirements-platform.txt
      - run: uv run python scripts/install_workspace.py
      - run: uv run python scripts/export_environment_ids.py
      - run: uv run python -m pytest cloud_platform/tests tests/platform -q --durations=30 --junitxml=results/ci/platform.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-timings
          path: results/ci/*.xml

  platform-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          dockerfile: Dockerfile.platform
          image: groundwork-platform:local
          scope: platform
      - uses: ./.github/actions/build-image
        with:
          dockerfile: Dockerfile.runtime
          image: groundwork-runtime:local
          scope: science
      - run: docker compose -f compose.platform.yml config --quiet
      - name: Verify the paired local worker and science runtime
        run: |
          docker compose -f compose.platform.yml up --no-build --detach --wait
          docker compose -f compose.platform.yml exec -T api python deploy/verify_local.py --url http://localhost:8080
      - name: Stop the verification stack
        if: always()
        run: docker compose -f compose.platform.yml down

  validate:
    if: always()
    needs: [platform-tests, platform-stack]
    runs-on: ubuntu-latest
    steps:
      - run: test "$TEST_RESULT" = success && test "$STACK_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.platform-tests.result }}
          STACK_RESULT: ${{ needs.platform-stack.result }}

  deploy:
    if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify the immutable scientific source
        id: runtime
        run: |
          runtime_source_sha="$(git log -1 --format=%H -- Dockerfile.runtime scripts/install_workspace.py scripts/workspace.py a2a-engine a2a-agent a2a-judge expt-runner games experiments)"
          test -n "$runtime_source_sha"
          echo "source_sha=$runtime_source_sha" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Submit tested source to Cloud Build
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          RUNTIME_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
        run: >-
          gcloud builds submit . --project "$GCP_PROJECT" --region "$GCP_REGION"
          --config cloudbuild.yaml
          --service-account "projects/$GCP_PROJECT/serviceAccounts/groundwork-build@$GCP_PROJECT.iam.gserviceaccount.com"
          --gcs-source-staging-dir "gs://$GCP_PROJECT-groundwork-build-source/source"
          --substitutions "_REGION=$GCP_REGION,_SOURCE_SHA=$GITHUB_SHA,_RUNTIME_SOURCE_SHA=$RUNTIME_SOURCE_SHA,_GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
