name: Build cached local images
description: Build selected images together with one builder and optional cache exports
inputs:
  targets:
    required: true
    description: Bake group or target (runtime, platform, or viewer)
  cache-write:
    default: "false"
    description: Export caches from the designated writer job only
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/bake-action@v6
      with:
        source: .
        files: .github/actions/build-image/docker-bake.hcl
        targets: ${{ inputs.targets }}
        load: true
      env:
        CI_CACHE_WRITE: ${{ inputs.cache-write }}
    # Fixture Dockerfiles inherit the loaded agent image by its local tag.
    - run: docker buildx use default
      shell: bash
